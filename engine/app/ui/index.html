/* ------------------------------------------------ data that does not print
   A-1 requires these but the report has nowhere to show them: the scope of
   work, each property's coordinates, whether a reconsideration of value was
   requested.  One row per data point; a column per comparable where it repeats. */
/* ------------------------------------------------- the property's structure
   Dwellings and the units in each, ADUs, outbuildings -- the tree the report
   is built from (uad/structure.py).  Each change adds or removes the parts of
   the report that follow from it (a Unit Interior per unit, a Dwelling
   Exterior per dwelling, an Outbuilding section, a unit row in every
   comparable) and the counts 3.005 / 3.006 / 3.007 are read from the tree. */
async function drawStructure(w){
  if(!w.querySelector('.stree')) w.innerHTML='<div class="skel">'+'<i></i>'.repeat(8)+'</div>';
  const [r,ob]=await Promise.all([api(`/cases/${S.caseId}/structure`),api('/fields/12.001/options')]);
  if(S.view!=='structure') return;
  if(!r||!r.ok){ w.innerHTML='<div class="panel empty">Could not load the structure.</div>'; return; }
  drawStructureTree(w,r.data,((ob&&ob.ok&&ob.data.options)||[]));
}
function drawStructureTree(w,t,types){
  const c=t.counts;
  const unitRow=(u)=>`<div class="srow"><span class="sk">${u.adu?'ADU':'Unit'}</span>
      <span class="sn">${esc(u.identifier||(u.adu?'ADU':'Unit'))}</span>
      <button class="iconbtn" data-rm="${esc(u.key)}" data-what="${u.adu?'this ADU':'this unit'}" title="Remove" aria-label="Remove">${ICON.bin}</button></div>`;
  const dw=t.dwellings.map((d,i)=>`<div class="sbox"><div class="shead"><span class="eyebrow">Dwelling ${i+1}</span>
      <b>${esc(d.identifier||'Primary dwelling')}</b>
      ${t.dwellings.length>1?`<button class="iconbtn" data-rm="${esc(d.key)}" data-what="this dwelling and its units" title="Remove dwelling">${ICON.bin}</button>`:''}</div>
      ${d.units.map(unitRow).join('')}
      <div class="sadd"><button class="btn sm" data-add="unit" data-dw="${i}">+ Living unit</button>
        <button class="btn sm" data-add="adu" data-dw="${i}">+ ADU in this dwelling</button></div></div>`).join('');
  const obs=t.outbuildings.map(o=>`<div class="sbox"><div class="shead"><span class="eyebrow">Outbuilding</span>
      <b>${esc((types.find(x=>x.value===o.type)||{}).label||o.type||'Outbuilding')}</b>
      <button class="iconbtn" data-rm="${esc(o.key)}" data-what="this outbuilding" title="Remove outbuilding">${ICON.bin}</button></div>
      ${o.units.map(unitRow).join('')}</div>`).join('');
  const opts=types.filter(x=>x.value!=='Other').map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
  w.innerHTML=`<div class="panel stree">
    <div class="compbar"><span class="k">The property, as the report is built from it</span>
      <span style="font:400 11px var(--mono);color:var(--muted)">${c.units_excluding_adus} unit(s) excluding ADUs &middot; ${c.adus} ADU(s) &middot; ${c.dwellings} dwelling(s) &middot; ${c.outbuildings} outbuilding(s) &mdash; counts follow the tree (F-1 3.005-3.007)</span></div>
    <p class="lede" style="margin:4px 0 14px">Each dwelling gets its own Dwelling Exterior, each unit and ADU its own Unit Interior, each outbuilding its own section, and every comparable a row for each unit. Nothing is removed without showing what goes with it.</p>
    <div class="sgrid">${dw}${obs}</div>
    <div class="sadd" style="margin-top:14px">
      <button class="btn" data-add="dwelling">+ Dwelling</button>
      <select class="search" id="ob-type" aria-label="Outbuilding type" style="max-width:220px">${opts}<option value="ADUGarage">ADU/Garage (with ADU)</option></select>
      <button class="btn" data-add="outbuilding">+ Outbuilding</button>
      <button class="btn" data-add="adu-out">+ ADU in a detached outbuilding</button></div></div>`;
  const change=async(body,method)=>{
    const r=method==='DELETE'?await api(`/cases/${S.caseId}/structure?key=${encodeURIComponent(body.key)}`,{method:'DELETE'})
                             :await api(`/cases/${S.caseId}/structure`,{method:'POST',body:JSON.stringify(body)});
    if(!r||!r.ok){ UADDialog.alert((r&&r.data&&r.data.detail)||'That change could not be made.',{title:'Not changed',eyebrow:'Property'}); return; }
    toast((r.data.said||[]).join(' · ')||'Updated',3500);
    drawStructureTree(w,r.data,types);
    refresh(); checkFresh('form');        // the sections and the report follow
  };
  w.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add, dw=Number(b.dataset.dw||0), ty=($('#ob-type')||{}).value||'Other';
    if(k==='unit') change({add:'unit',dwelling:dw});
    else if(k==='adu') change({add:'adu',dwelling:dw});
    else if(k==='dwelling') change({add:'dwelling'});
    else if(k==='adu-out') change({add:'adu',location:'outbuilding',type:ty==='ADUGarage'?'ADUGarage':'StandaloneADU'});
    else if(k==='outbuilding') change(ty==='ADUGarage'?{add:'adu',location:'outbuilding',type:'ADUGarage'}:{add:'outbuilding',type:ty});
  });
  w.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.rm;
    const l=await api(`/cases/${S.caseId}/structure/loss?key=${encodeURIComponent(key)}`);
    const lost=(l&&l.ok&&l.data.lost)||[];
    const msg=lost.length?['These answers go with it:'].concat(lost.slice(0,25)).join('\n'):'Nothing entered for it is lost.';
    if(!await UADDialog.confirm(msg,{title:`Remove ${b.dataset.what}?`,ok:'Remove',danger:true,eyebrow:'Property'})) return;
    change({key},'DELETE');
  });
}
async function drawExtra(w){
  if(!w.querySelector('.xtbl')) w.innerHTML='<div class="skel">'+'<i></i>'.repeat(14)+'</div>';
  const r=await api(`/cases/${S.caseId}/extra`);
  if(S.view!=='extra') return;
  if(!r||!r.ok){ w.innerHTML='<div class="panel empty">Could not load the data.</div>'; return; }
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML=`<div class="compbar"><span class="k">Data required by A-1 that does not print</span>
    <span style="font:400 11px var(--mono);color:var(--muted)">${r.data.missing_required} required value(s) still empty ·
    saved the moment it changes · checked against the GSE subschema before it is kept</span></div>`;
  for(const g of r.data.groups){
    const scopes=[...new Set(g.rows.flatMap(x=>x.answers.map(a=>a.scope)))];
    const tbl=document.createElement('table'); tbl.className='comps xtbl';
    tbl.innerHTML=`<thead><tr><th style="width:34%">${esc(g.title)}</th>${scopes.map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody></tbody>`;
    const body=tbl.querySelector('tbody');
    for(const row of g.rows){
      const tr=document.createElement('tr');
      const need=row.conditionality==='R'?'<b title="Required">*</b>':`<span title="${esc(row.details)}" style="color:var(--muted)">†</span>`;
      tr.innerHTML=`<td class="lbl" title="${esc(row.definition)}">${esc(row.label)} ${need}</td>`;
      for(let si=0;si<scopes.length;si++){
        const td=document.createElement('td');
        const answers=row.answers.map((a,i)=>({...a,i})).filter(a=>a.scope===scopes[si]);
        if(!answers.length){ td.innerHTML='<span style="color:var(--muted)">—</span>'; tr.appendChild(td); continue; }
        answers.forEach((a,k)=>{
          const inst=row.answers.filter(x=>x.scope===a.scope).indexOf(row.answers[a.i]);
          const ctl=extraControl(row,a.value);
          if(a.instance){ const l=document.createElement('div'); l.style.cssText='font-size:10px;color:var(--muted)'; l.textContent=a.instance; td.appendChild(l); }
          ctl.onchange=async()=>{
            ctl.classList.remove('bad');
            const res=await api(`/cases/${S.caseId}/extra/${row.uid}`,{method:'PATCH',
              body:JSON.stringify({value:ctl.value,scope:si,instance:inst})});
            if(res&&res.ok) toast('Saved '+row.label);
            else{ ctl.classList.add('bad'); toast((res&&res.data&&res.data.detail)||'Could not save',6000); }
          };
          td.appendChild(ctl);
        });
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
    const wrap=document.createElement('div'); wrap.className='gridwrap'; wrap.style.marginBottom='16px';
    wrap.appendChild(tbl); p.appendChild(wrap);
  }
  w.innerHTML=''; w.appendChild(p);
}
function extraControl(row,value){
  let el;
  const fmt=(row.format||'').toLowerCase();
  const opts=fmt==='boolean'?[{value:'true',label:'Yes'},{value:'false',label:'No'}]:row.options;
  if(opts&&opts.length){
    el=document.createElement('select');
    [{value:'',label:''}].concat(opts).forEach(o=>{const op=document.createElement('option');
      op.value=o.value; op.textContent=o.label.replace(/(?<=[a-z])(?=[A-Z])/g,' '); if(o.value===value) op.selected=true; el.appendChild(op);});
  }else{
    el=document.createElement('input'); el.value=value;
    if(fmt==='numeric') el.inputMode='decimal';
  }
  return el;
}

async function drawComps(w){
  w.innerHTML='<div class="panel empty">Loading the grid…</div>';

  const bar=document.createElement('div'); bar.className='compbar';
  bar.innerHTML=`<span class="k">${esc(g.title)}</span>
    <span style="font:400 11px var(--mono);color:var(--muted)">
    ${g.comparables.length} comparable(s) · ${g.rows.length} rows from the B-1 supplement ·
    drag a column head to reorder · drag a divider to resize</span>`;
  const kinds=document.createElement('div'); kinds.className='kinds';
  for(const [k,label] of [['sales','Sales'],['rental','Rental'],['grm','GRM'],['not_used','Not Used']]){
    const b=document.createElement('button'); b.className='tab'; b.textContent=label;
    b.style.borderBottom='1px solid var(--rule)';
    b.setAttribute('aria-selected',String(kind===k));
    b.onclick=()=>{S.compKind=k;drawComps(w);};
    kinds.appendChild(b);
  }
  const add=document.createElement('button'); add.className='addbtn';
  add.textContent='+ Add comparable';
  add.onclick=async()=>{
    const res=await api(`/cases/${S.caseId}/comparables`,
      {method:'POST',body:JSON.stringify({kind})});
    toast(res.ok?'Comparable added':'Could not add'); drawComps(w);};
  bar.appendChild(kinds);
  bar.appendChild(document.createElement('span')).style.flex='1';
  bar.appendChild(add);
  p.appendChild(bar);

  const wrap=document.createElement('div'); wrap.className='gridwrap';
  const n=g.comparables.length;
  const W=(S.compWidths=S.compWidths||{});
  const wid=(key,fallback)=>W[kind+'|'+key]||fallback;

  let head=`<colgroup><col style="width:${wid('row',210)}px">`
          +`<col style="width:${wid('subject',150)}px">`;
  for(let i=0;i<n;i++) head+=`<col style="width:${wid('c'+i,150)}px"><col style="width:${wid('a'+i,78)}px">`;
  head+='</colgroup><thead><tr>';
  head+=`<th data-col="row">Row<span class="grip"></span></th>`;
  head+=`<th data-col="subject">Subject<span class="grip"></span></th>`;
  for(const c of g.comparables){
    head+=`<th class="comp" colspan="2" draggable="true" data-index="${c.index}" data-col="c${c.index-1}">
      <div class="compcell">
        <label class="ph" title="Photo of comparable ${c.index}">
          ${c.photo?`<img src="${esc(c.photo)}" alt="">`:'<span>+ photo</span>'}
          <input type="file" accept="image/*" hidden>
        </label>
        <div class="meta">
          <div>Comparable #${c.index}</div>
          <div class="addr">${esc(c.address||'—')}</div>
          <div class="tools">
            <button data-act="remove" title="Remove this comparable">Remove</button>
          </div>
        </div>
      </div><span class="grip"></span></th>`;
  }
  head+='</tr></thead>';

  let body='';
  for(const row of g.rows){
    if(row.heading){
      body+=`<tr class="head"><td class="lbl">${esc(row.label)}</td><td colspan="${1+2*n}"></td></tr>`;
      continue;}
    body+=`<tr><td class="lbl">${esc(row.label)}</td>`;
    body+=`<td>${cell(row.subject_fid,0,row.subject_points,row.subject_parts)}</td>`;
    for(let i=0;i<n;i++){
      const c=row.cells[i]||{};
      body+=`<td>${cell(row.comp_fid,i+1,row.comp_points,c.parts)}</td>`;
      body+=`<td class="adj">${row.adjustable
        ?adjCell(i+1,row.adjust_type,c.adjust_raw||''):''}</td>`;
    }
    body+='</tr>';
  }
  wrap.innerHTML=`<table class="comps">${head}<tbody>${body}</tbody></table>`;
  p.appendChild(wrap);
  w.innerHTML=''; w.appendChild(p);
  wireGrid(wrap,g,kind,w);
  if(kind==='sales') p.appendChild(transferLink());
}

/* A cell is one input per data point the field is made of: an address is six,
   and writing one string into the first would quietly drop the city. */
function cell(fid,column,points,parts){
  if(!fid) return `<span style="color:var(--muted)">—</span>`;
  const list=(points&&points.length)?points:[{data_point:'',options:[]}];
  parts=parts||{};
  return list.map(p=>{
    const value=parts[p.data_point]||'';
    const attrs=`data-fid="${esc(fid)}" data-col="${column}" data-dp="${esc(p.data_point)}"`;
    const hint=list.length>1?` title="${esc(p.data_point)}" placeholder="${esc(p.data_point)}"`:'';
    if((p.format||'').toLowerCase()==='boolean'){
      return `<select ${attrs} onchange="saveCell(this)">`
        +`<option value=""></option>`
        +`<option value="true"${value==='true'?' selected':''}>Yes</option>`
        +`<option value="false"${value==='false'?' selected':''}>No</option></select>`;
    }
    if(p.options&&p.options.length&&p.options.length<=60){
      const opts=['<option value=""></option>'].concat(p.options.map(o=>
        `<option value="${esc(o.value)}"${o.value===value?' selected':''}>${esc(o.label)}</option>`));
      return `<select ${attrs} onchange="saveCell(this)">${opts.join('')}</select>`;
    }
    return `<input value="${esc(value)}" ${attrs}${hint} onchange="saveCell(this)">`;
  }).join('');
}

function adjCell(column,adjustType,value){
  if(!adjustType) return '';
  return `<input value="${esc(value)}" data-col="${column}"
    data-adjust="${esc(adjustType)}" onchange="saveCell(this)">`;
}

/* Column resizing, comparable reordering, removal and photos. */
function wireGrid(wrap,g,kind,w){
  const table=wrap.querySelector('table');
  const cols=[...table.querySelectorAll('col')];
  const key=name=>kind+'|'+name;

  table.querySelectorAll('th .grip').forEach(grip=>{
    grip.addEventListener('mousedown',e=>{
      e.preventDefault(); e.stopPropagation();
      const th=grip.closest('th');
      const start=e.clientX;
      const index=[...th.parentNode.children].indexOf(th);
      const colIndex=th.classList.contains('comp')? 2+2*([...table.querySelectorAll('th.comp')].indexOf(th)) : index;
      const col=cols[colIndex];
      const startW=parseFloat(col.style.width)||th.getBoundingClientRect().width;
      const move=ev=>{
        const next=Math.max(46,startW+(ev.clientX-start));
        col.style.width=next+'px';
        S.compWidths[key(th.dataset.col)]=next;
      };
      const up=()=>{document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        saveWidths();};
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    });
  });

  let dragged=null;
  table.querySelectorAll('th.comp').forEach(th=>{
    th.addEventListener('dragstart',e=>{dragged=th;th.classList.add('drag');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',th.dataset.index);});
    th.addEventListener('dragend',()=>{th.classList.remove('drag');
      table.querySelectorAll('th.comp').forEach(x=>x.classList.remove('over'));});
    th.addEventListener('dragover',e=>{e.preventDefault();th.classList.add('over');});
    th.addEventListener('dragleave',()=>th.classList.remove('over'));
    th.addEventListener('drop',async e=>{
      e.preventDefault(); th.classList.remove('over');
      if(!dragged||dragged===th) return;
      const from=Number(dragged.dataset.index), to=Number(th.dataset.index);
      const order=g.comparables.map(c=>c.index);
      order.splice(order.indexOf(from),1);
      order.splice(order.indexOf(to)+(to>from?1:0),0,from);
      const res=await api(`/cases/${S.caseId}/comparables/order`,
        {method:'POST',body:JSON.stringify({kind,order})});
      toast(res.ok?`Comparable ${from} is now #${order.indexOf(from)+1}`:'Could not reorder');
      drawComps(w);
    });
    const remove=th.querySelector('[data-act=remove]');
    if(remove) remove.onclick=async()=>{
      if(!await UADDialog.confirm('The comparables after it move up a place.',{title:`Remove comparable #${th.dataset.index}?`,ok:'Remove',danger:true}))return;
      const res=await api(`/cases/${S.caseId}/comparables/${th.dataset.index}?kind=${kind}`,
        {method:'DELETE'});
      toast(res.ok?'Comparable removed':'Could not remove'); drawComps(w);
    };
    const file=th.querySelector('input[type=file]');
    if(file) file.onchange=async()=>{
      if(!file.files.length)return;
      const fd=new FormData(); fd.append('file',file.files[0]);
      const q=`?category=comparable&comparable=${th.dataset.index}&section=22`
             +`&caption=${encodeURIComponent('Comparable #'+th.dataset.index)}`;
      const res=await fetch(`/api/cases/${S.caseId}/media${q}`,{method:'POST',body:fd});
      toast(res.ok?'Photo added':'Could not add the photo'); drawComps(w);
    };
  });
}

/* Every cell is written inside the property that column is about, so a
   comparable's value can never land on the subject. */
async function saveCell(el){
  const column=Number(el.dataset.col||0);
  const kind=S.compKind||'sales';
  const body={value:el.value,kind};
  if(el.dataset.adjust) body.adjust_type=el.dataset.adjust;

    {method:'PATCH',body:JSON.stringify(body)});

/* ------------------------------------------------------------ review */
/* Errors block the signature, warnings do not, and information is what the
   engine could not decide for itself and a person must read. */
const GROUPS=[
  ['Fatal','Errors','These stop the report being signed.'],
  ['Warning','Warnings','Worth checking; they do not block the signature.'],
  ['Review','Information','Rules that need a person to judge them.'],
];

function drawReview(w){
  const rep=S.review;
  const p=document.createElement('div'); p.className='panel';
  const head=document.createElement('div');
  head.innerHTML=`<div class="counts" style="max-width:520px">
    <div class="count${rep.counts.fatal?' bad':''}"><b>${rep.counts.fatal}</b><span>Errors</span></div>
    <div class="count"><b>${rep.counts.warning}</b><span>Warnings</span></div>
    <div class="count"><b>${rep.counts.review}</b><span>Information</span></div>
    <div class="count"><b>${rep.counts.schema}</b><span>Schema</span></div></div>`;
  const rerun=document.createElement('button');
  rerun.className='btn'; rerun.style.marginTop='10px';
  rerun.textContent='Re-run the review';
  rerun.onclick=async()=>{rerun.disabled=true;rerun.textContent='Re-running…';
    await refresh(); toast('Review re-run'); };
  head.appendChild(rerun);
  p.appendChild(head);

  for(const [sev,title,lede] of GROUPS){
    const items=(rep.items||[]).filter(i=>i.severity===sev);
    if(!items.length) continue;
    const h=document.createElement('div'); h.className='bar k';
    h.textContent=`${title} — ${items.length}`; p.appendChild(h);
    const note=document.createElement('p');
    note.style.cssText='font-size:11.5px;color:var(--muted);margin:6px 0 0';
    note.textContent=lede; p.appendChild(note);
    for(const i of items.slice(0,400)) p.appendChild(findingRow(i));
  }
  if(!(rep.items||[]).length){
    const ok=document.createElement('p'); ok.className='empty';
    ok.textContent='Nothing to report — no finding from the schema, the H-1 rules or completeness.';
    p.appendChild(ok);
  }
  w.innerHTML=''; w.appendChild(p);
}

/* Every finding names the rule that raised it, where it came from, and the
   field it is about -- and offers to take the appraiser straight there. */
function findingRow(i){
  const d=document.createElement('div'); d.className='finding';
  d.style.cursor='default';
  const where=[i.section,i.subsection,i.label].filter(Boolean).join(' · ');
  d.innerHTML=`<div class="top">
      <span class="sev ${esc(i.severity)}">${esc(i.severity==='Review'?'Information':i.severity)}</span>
      <code>${esc(i.code)}</code>
      <span style="font-size:11px;color:var(--muted)">${esc(i.source)}${i.field_id?' · '+esc(i.field_id):''}</span>
    </div>
    <p>${esc(i.message)}</p>
    ${where?`<p style="color:var(--muted)">${esc(where)}</p>`:''}
    ${i.detail?`<p style="color:var(--muted)">${esc(i.detail)}</p>`:''}`;
  if(i.field_id){
    const fix=document.createElement('button');
    fix.className='addbtn'; fix.style.marginTop='5px';
    fix.textContent='Fix this';
    fix.onclick=e=>{e.stopPropagation();jump(i);};
    d.appendChild(fix);
  }
  return d;
}
/* A finding takes the appraiser to the field on the report, not to a form
   about it. */
function jump(item){
  if(item.section_number&&item.section_number!==S.section){
    S.section=item.section_number; drawRail();
  }
  goToReport({fid:item.field_id,secn:item.section_number,
              section:(S.sections.find(s=>s.number===item.section_number)||{}).name});
}
function drawHistory(w){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<div class="bar k">Audit trail</div>';
  w.innerHTML=''; w.appendChild(p);
  api('/cases/'+S.caseId+'/history').then(r=>{

        <b style="font-size:11.5px">${esc(h.action)}</b>
        <span style="font-size:11px;color:var(--muted)">${esc(h.actor)}</span></div>

/* ------------------------------------------------ field guidance
   What UAD 3.6 asks of the field being filled, from the specifications
   themselves (A-1: required or when, definition, format; H-1: every rule on
   the field), with each rule's live status for this report.  WinTOTAL shows a
   static note; this is checked as you type (knowledge/competitors). */
const REQ={R:['Required','req'],CR:['Required when','cond'],O:['Optional','opt']};
function renderGuide(){
  const box=$('#insp-guide'); if(!box) return;
  const g=S.guide;
  if(!g){ box.innerHTML=`<div class="panelhead k">Field guidance</div>
    <div class="panelblock gd"><span class="empty" style="padding:0">Click any field in the report to see what UAD 3.6 asks of it, and whether it passes.</span></div>`; return; }
  const req=REQ[g.requirement]||['Not in A-1','opt'];
  const icon={fail:'✕',read:'!',ok:'✓'};
  const rules=g.rules.length?`<ul class="gd-rules">${g.rules.map(r=>`<li class="${r.status}" title="${esc(r.severity)}"><i>${icon[r.status]}</i><code>${esc(r.id)}</code><span>${esc(r.text)}</span></li>`).join('')}</ul>`
    :'<p class="gd-none">No H-1 rule checks this field on its own.</p>';
  const pts=g.points.slice(0,4).map(p=>`<li><b>${esc(p.label)}</b>${p.definition?` — ${esc(p.definition)}`:''}
      <small>${esc(p.format)}${p.max?` · up to ${p.max.toLocaleString()} characters`:''}${p.values?` · ${p.values} official values`:''}</small></li>`).join('');
  box.innerHTML=`<div class="panelhead k">Field guidance</div>
    <div class="panelblock gd">
      <div class="gd-h"><b>${esc(g.label)}</b><code>${esc(g.field_id)}</code></div>
      <div class="gd-s">${esc(g.section)}</div>
      <span class="gd-badge ${req[1]}">${req[0]}</span>${(g.scope||[]).length?`<span class="gd-scope">for ${esc(g.scope.join(' and '))}</span>`:''}
      ${g.conditions.length?`<ul class="gd-cond">${g.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
      ${g.problems.length?`<div class="gd-prob">${g.problems.map(p=>`<div class="${p.severity==='Fatal'?'bad':'warn'}"><code>${esc(p.code)}</code> ${esc(p.message)}</div>`).join('')}</div>`:''}
      <div class="gd-k">What it is</div><ul class="gd-pts">${pts}</ul>
      ${g.points.length>4?`<p class="gd-none">and ${g.points.length-4} more parts</p>`:''}
      <div class="gd-k">H-1 checks</div>${rules}
    </div>`;
}
/* after an edit, the review is asked again once typing pauses: the outlines,
   the counts and the open guidance follow the report as it is */
function reviewSoon(){
  clearTimeout(S.revT);
  S.revT=setTimeout(async()=>{
    const id=S.caseId;

/* ------------------------------------------------ comment library
   Saved comments, inserted where the caret is in the report (or Alt+1 … 9
   while typing).  Kept in this browser -- on the desktop edition, in its own
   window profile. */
const LIB={
  get(){ try{ return JSON.parse(localStorage.getItem('uad-snippets')||'[]'); }catch(_){ return []; } },
  set(a){ try{ localStorage.setItem('uad-snippets',JSON.stringify(a.slice(0,60))); }catch(_){} }
};
function commentLibrary(anchor){
  let pop=$('#libpop'); if(pop){ pop.remove(); return; }
  pop=document.createElement('div'); pop.id='libpop'; pop.className='libpop';
  const draw=()=>{
    const list=LIB.get();
    pop.innerHTML=`<div class="lh"><span class="k">Comment library</span><button class="lx" aria-label="Close">&times;</button></div>
      <div class="ll">${list.length?list.map((s,i)=>`<div class="li"><span class="lk">${i<9?'Alt+'+(i+1):''}</span>
        <button class="lt" data-i="${i}" title="Insert at the caret">${esc(s.text.length>140?s.text.slice(0,140)+'…':s.text)}</button>
        <button class="ld" data-d="${i}" aria-label="Delete">&times;</button></div>`).join('')
        :'<p class="le">No saved comments yet. Type one below, or select text in a comment and choose “Save selection”.</p>'}</div>
      <textarea id="lib-new" rows="3" placeholder="A comment you use often…"></textarea>
      <div class="lb"><button class="addbtn" id="lib-sel">Save selection</button><button class="addbtn primary" id="lib-add">Save comment</button></div>
      <p class="le">Click into a comment in the report first; then click a saved comment to insert it there.</p>`;
    pop.querySelector('.lx').onclick=()=>pop.remove();
    pop.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{
      const t=LIB.get()[+b.dataset.i]; const f=$('#rf');
      if(t&&f&&f.contentWindow) f.contentWindow.postMessage({uad:'insert',text:t.text},'*');
    });
    pop.querySelectorAll('.ld').forEach(b=>b.onclick=()=>{ const a=LIB.get(); a.splice(+b.dataset.d,1); LIB.set(a); draw(); });
    pop.querySelector('#lib-add').onclick=()=>{
      const t=pop.querySelector('#lib-new').value.trim(); if(!t) return;
      const a=LIB.get(); a.push({text:t}); LIB.set(a); draw();
    };
    pop.querySelector('#lib-sel').onclick=()=>{
      let t=''; try{ t=String($('#rf').contentWindow.getSelection()||'').trim(); }catch(_){}
      if(!t){ toast('Select some text in a comment first.',3000); return; }
      const a=LIB.get(); a.push({text:t}); LIB.set(a); draw();
    };
  };
  draw();
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  pop.style.top=(r.bottom+6)+'px';
  pop.style.left=Math.max(8,Math.min(window.innerWidth-pop.offsetWidth-8,r.right-pop.offsetWidth))+'px';
  setTimeout(()=>document.addEventListener('mousedown',function off(e){
    if(!pop.contains(e.target)&&e.target!==anchor){ pop.remove(); document.removeEventListener('mousedown',off); }
  }),0);
}

/* ------------------------------------------------ SmartAdjust (T-1059)
   Adjustments suggested from the owner's rate profile (uad/smartadjust.py),
   each beside what the grid holds now.  Nothing is written until the
   appraiser applies the ones ticked; blanks are ticked to start with, a figure
   the appraiser already entered is not. */
const money=n=>(n<0?'$('+Math.abs(n).toLocaleString()+')':'$'+n.toLocaleString());
const RATE_LABEL={gla:'GLA $/sq ft',gla_threshold:'GLA threshold sq ft',site:'Site $/sq ft',site_threshold:'Site threshold sq ft',
  age:'Age $/year',age_threshold:'Age threshold years',bedroom:'Bedroom $',half_bath:'Half bath $',basement:'Finished basement $',
  garage:'Garage space $',outdoor:'Outdoor living $',exposure:'Exposure (share of list)',design:'Design step $',cooling:'Cooling $'};
function smartAdjust(){
  const old=$('#sadj-ov'); if(old) old.remove();
  const ov=document.createElement('div'); ov.id='sadj-ov'; ov.className='sadj-ov';
  ov.innerHTML=`<div class="sadj" role="dialog" aria-modal="true" aria-label="Suggested adjustments">
    <div class="sadj-h"><div><span class="k">SmartAdjust</span><h3>Suggested adjustments</h3>
      <p>From your rate profile, against what each comparable's grid prints. Tick what to apply; nothing changes until you do.</p></div>
      <button class="sadj-x" aria-label="Close">&times;</button></div>
    <div class="sadj-b"><p class="sadj-wait">Calculating…</p></div>
    <div class="sadj-f"><span class="sadj-n"></span><button class="btn" id="sadj-cancel">Close</button><button class="btn primary" id="sadj-go" disabled>Apply</button></div></div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector('.sadj-b'), go=ov.querySelector('#sadj-go');
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  ov.querySelector('.sadj-x').onclick=close; ov.querySelector('#sadj-cancel').onclick=close;
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  let prof='', rates={}, data=null;
  const count=()=>{ const n=body.querySelectorAll('input.pick:checked').length;
    ov.querySelector('.sadj-n').textContent=n?n+' to apply':'Nothing ticked'; go.disabled=!n;
    go.textContent=n?'Apply '+n:'Apply'; };
  async function load(){
    body.innerHTML='<p class="sadj-wait">Calculating…</p>';
    const q=new URLSearchParams({profile:prof,rates:JSON.stringify(rates)});
    const r=await api('/cases/'+S.caseId+'/smartadjust?'+q);
    if(!r||!r.ok){ body.innerHTML=`<p class="sadj-wait">${esc((r&&r.data&&r.data.detail)||'The suggestions could not be worked out.')}</p>`; return; }
    data=r.data; prof=data.profile.name; draw();
  }
  function draw(){
    const p=data.profile;
    const head=`<div class="sadj-p"><label>Profile <select id="sadj-prof">${data.profiles.map(n=>`<option${n===p.name?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
      <details><summary>Rates</summary><div class="sadj-rates">${data.rate_keys.map(k=>`<label><span>${esc(RATE_LABEL[k]||k)}</span>
        <input type="number" step="any" data-rate="${k}" value="${p[k]}"></label>`).join('')}</div>
        <div class="sadj-rb"><small>${esc(p.source)}</small><button class="btn" id="sadj-re">Recalculate</button></div></details></div>`;
    const cols=data.comparables.map(c=>{
      const pct=v=>c.price?(100*v/c.price).toFixed(1)+'%':'—';
      const rows=c.lines.map((l,i)=>{
        const blank=!l.current||l.current==='$0';
        const same=l.current.replace(/[$,()]/g,'')===String(Math.abs(l.amount))&&((l.current.indexOf('(')>=0)===(l.amount<0));
        const tick=l.amount!==0&&blank;
        return `<tr class="${same?'same':''}"><td>${esc(l.label)}</td><td>${esc(l.subject)}</td><td>${esc(l.comparable)}</td>
          <td class="num ${l.amount<0?'neg':l.amount>0?'pos':''}" title="${esc(l.basis)}">${money(l.amount)}<small>${esc(l.basis)}</small></td>
          <td class="num">${esc(l.current||'—')}</td>
          <td><input type="checkbox" class="pick" data-c="${c.number}" data-t="${esc(l.adjust_type)}" data-a="${l.amount}" ${same?'disabled':tick?'checked':''}
            aria-label="Apply ${esc(l.label)} to comparable ${c.number}"></td></tr>`;}).join('');
      // the customary guidelines: net within 15 %, gross within 25 % of the price
      const over=c.price&&(Math.abs(c.net)>.15*c.price||c.gross>.25*c.price);
      return `<section class="sadj-c"><div class="sadj-ch"><b>Comparable #${c.number}</b>
        <span${over?' class="over" title="Past the 15 % net / 25 % gross guideline: support it in the narrative"':''}>Net ${money(c.net)} · ${pct(c.net)} &nbsp; Gross ${money(c.gross)} · ${pct(c.gross)}${over?' &nbsp;! over guideline':''}</span></div>
        ${c.lines.length?`<table><thead><tr><th>Row</th><th>Subject</th><th>Comparable</th><th class="num">Suggested</th><th class="num">In the grid</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
          :'<p class="sadj-wait">Nothing in this profile applies to this comparable.</p>'}</section>`;
    }).join('');
    body.innerHTML=head+(cols||'<p class="sadj-wait">This report has no sales comparables yet.</p>');
    body.querySelector('#sadj-prof').onchange=e=>{ prof=e.target.value; rates={}; load(); };
    body.querySelector('#sadj-re').onclick=()=>{ rates={}; body.querySelectorAll('input[data-rate]').forEach(i=>{ rates[i.dataset.rate]=i.value; }); load(); };
    body.querySelectorAll('input.pick').forEach(i=>i.onchange=count);
    count();
  }
  go.onclick=async()=>{
    const picks=[...body.querySelectorAll('input.pick:checked')].map(i=>({comparable:+i.dataset.c,adjust_type:i.dataset.t,amount:+i.dataset.a}));
    if(!picks.length) return;
    go.disabled=true; go.textContent='Applying…';
    const r=await api('/cases/'+S.caseId+'/smartadjust',{method:'POST',body:JSON.stringify({picks})});
    if(!r||!r.ok){ toast('Not applied: '+((r&&r.data&&r.data.detail)||'unknown error'),6000); count(); return; }
    toast(r.data.written+' adjustment'+(r.data.written===1?'':'s')+' applied',3000);
    S.dirty=true; checkFresh('form'); reviewSoon(); load();
  };
  load();
}

/* ------------------------------------------------ PDF without a server browser
   A serverless host (the live site) has no Chromium to print with.  This
   browser lays the report out in a hidden frame, the same way it lays out the
   preview, reports where it drew every glyph, rule and picture
   (pdfdraw.DISPLAY_JS, served at /api/report/display.js), and the server draws
   the PDF from that after checking the words against its own pages.  Files
   over 4.5 MB (the most a serverless function answers) come down in parts. */
let HOST=null;
async function hostInfo(){
  if(!HOST){ const r=await apiRaw('/host'); HOST=(r&&r.ok)?r.data:{serverLayout:true}; }
  return HOST;
}
async function gzipped(text){
  if(!window.CompressionStream) return null;
  try{ const st=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    return await new Response(st).arrayBuffer(); }catch(e){ return null; }
}
async function fetchParts(url,parts,size,type){
  if(parts<=1){ const r=await fetch(url); if(!r.ok) throw new Error('download failed ('+r.status+')'); return await r.blob(); }
  const out=[];
  for(let n=0;n<parts;n++){
    const r=await fetch(url+(url.includes('?')?'&':'?')+'part='+n);
    if(!r.ok) throw new Error('part '+(n+1)+' of '+parts+' failed ('+r.status+')');
    out.push(await r.blob());
  }
  const b=new Blob(out,{type});
  if(size&&b.size!==size) throw new Error('the download arrived incomplete');
  return b;
}
function pdfFrame(caseId){
  return new Promise((done,fail)=>{
    const f=document.createElement('iframe');
    f.setAttribute('aria-hidden','true'); f.tabIndex=-1;
    f.style.cssText='position:fixed;left:-12000px;top:0;width:900px;height:1400px;border:0';
    let data=null, timer=null;
    const end=()=>{ window.removeEventListener('message',on); clearTimeout(timer); };
    const on=e=>{
      if(e.source!==f.contentWindow||!e.data) return;
      if(e.data.uad==='layout-data') data=e.data;
      if(e.data.uad==='frame-ready'&&!e.data.stale){ end(); done({f,key:e.data.key,data}); }
    };
    window.addEventListener('message',on);
    timer=setTimeout(()=>{ end(); f.remove(); fail(new Error('the report took too long to lay out')); },180000);
    f.src=`/api/cases/${caseId}/preview?t=${Date.now()}`;
    document.body.appendChild(f); WARM_FRAMES.add(f.contentWindow);
  });
}
async function drawPdf(again){
  const id=S.caseId;
  toast('Drawing the PDF from this browser’s layout…',4000);
  barStart();
  let fr=null;
  try{
    const [src,laid]=await Promise.all([fetch('/api/report/display.js').then(r=>r.text()),pdfFrame(id)]);
    fr=laid;
    const w=fr.f.contentWindow, d=w.document;
    if(d.fonts) await d.fonts.ready;
    await Promise.all(Array.from(d.images).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    const display=w.eval('('+src+')()');
    const body=JSON.stringify({key:fr.key,display,
      measured:fr.data&&fr.data.key===fr.key?fr.data.measured:undefined,
      caps:fr.data&&fr.data.key===fr.key?fr.data.caps:undefined});
    const zipped=await gzipped(body);
    const r=await fetch(`/api/cases/${id}/report.pdf`,{method:'POST',
      headers:zipped?{'Content-Type':'application/json','Content-Encoding':'gzip'}:{'Content-Type':'application/json'},
      body:zipped||body});
    const res=await r.json().catch(()=>({error:'the server did not answer ('+r.status+')'}));
    if(!r.ok&&!(r.status===409&&res.changed&&!again))
      throw new Error(res.error||res.detail||('the PDF could not be drawn ('+r.status+')'));
    if(r.ok){
      const lost=Object.keys(res.missing_glyphs||{});
      if(lost.length) UADDialog.alert(`These characters have no glyph in the report's typefaces and are left out of the PDF: ${lost.join(' ')}`,
        {title:'Some characters could not be drawn',eyebrow:'PDF'});
      return res;
    }
  }finally{ barStop(); if(fr) fr.f.remove(); }
  return await drawPdf(true);           // the report changed while it was laid out: once more
}
async function openPdf(){
  // opened now, inside the click, so a pop-up blocker lets it through
  const win=window.open('','_blank');
  try{
    const res=await drawPdf();
    const blob=await fetchParts(`/api/cases/${S.caseId}/report.pdf`,res.parts,res.size,'application/pdf');
    const url=URL.createObjectURL(blob);
    if(win) win.location=url; else { const a=document.createElement('a'); a.href=url; a.download='appraisal.pdf'; a.click(); }
    toast(`PDF drawn — ${res.pages} pages`);
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){
    if(win) win.close();
    UADDialog.alert(e.message,{title:'The PDF could not be made',eyebrow:'PDF'});
  }
}
async function exportZip(){
  try{
    await drawPdf();
    barStart();
    let r;
    try{ r=await apiRaw(`/cases/${S.caseId}/package`,{method:'POST',body:'{}'}); }finally{ barStop(); }
    if(!r||!r.ok){
      const d=(r&&r.data)||{};
      await UADDialog.alert([d.error||'The package could not be built.'].concat(d.reasons||[]).join('\n'),
        {title:'This case cannot be exported yet',eyebrow:'Delivery package'});
      return;
    }
    const p=r.data;
    const parts=[];
    for(let n=0;n<p.parts;n++){
      const q=await fetch(`/api/cases/${S.caseId}/package/part/${n}?sha=${p.sha256}`);
      if(!q.ok) throw new Error('part '+(n+1)+' of '+p.parts+' failed ('+q.status+')');
      parts.push(await q.blob());
    }
    const zip=new Blob(parts,{type:'application/zip'});
    if(zip.size!==p.size) throw new Error('the package arrived incomplete');
    const url=URL.createObjectURL(zip), a=document.createElement('a');
    a.href=url; a.download=p.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    toast('Package exported'); refresh();
  }catch(e){
    UADDialog.alert(e.message,{title:'The package could not be exported',eyebrow:'Delivery package'});
  }
}
function fillSignoff(b){
  if(!b)return;
  const rep=S.review,c=S.case;
  const ready=rep.ready&&!(rep.blockers||[]).length;
  b.innerHTML=`<div class="panelhead k">Sign-off</div>
    <div class="panelblock"><div class="counts">
      <div class="count${rep.counts.fatal?' bad':''}"><b>${rep.counts.fatal}</b><span>Fatal</span></div>
      <div class="count"><b>${rep.counts.warning}</b><span>Warn</span></div>
      <div class="count"><b>${rep.counts.review}</b><span>Read</span></div>
      <div class="count"><b>${rep.counts.schema}</b><span>XSD</span></div></div></div>
    <div class="panelblock">
      <div class="verdict ${ready?'':'blocked'}">${ready?'Ready to sign':'Not ready to sign'}</div>
      ${(rep.blockers||[]).length?`<ul class="blockers">${rep.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    </div>
    <div class="panelhead k">Delivery package (B-1)</div>
    <div class="panelblock" id="pkg"><span class="empty" style="padding:0">Checking…</span></div>
    <div class="panelhead k">Sections reviewed</div>
    <div class="panelblock acks" id="acks"></div>
    <div class="panelblock actions">
      <button class="btn block" id="rev">Move to review</button>
      <button class="btn block primary" id="sign" ${ready&&c.can.includes('signed')?'':'disabled'}>Sign off</button>
      <a class="btn block" id="zip" href="/api/cases/${S.caseId}/package.zip">Export ZIP</a>
      <a class="btn block" id="openpdf" href="/api/cases/${S.caseId}/report.pdf" target="_blank">Open PDF</a>
      <a class="btn block" href="/api/cases/${S.caseId}/mismo.xml" target="_blank">Open MISMO XML</a>
      <a class="btn block" href="/api/cases/${S.caseId}/portable.xml" download
         title="The whole appraisal in one UAD 3.6 XML, pictures inside: import it anywhere this software runs">Download portable XML</a>
      <button class="btn block" id="back">All cases</button></div>
    ${(c.kind||'urar')==='urar'?`<div class="panelhead k">After this appraisal</div>
    <div class="panelblock actions">
      <button class="btn block" id="mkru" title="A new Restricted Appraisal Update Report for this property, pre-filled from this report (Appendix A-2)">New Restricted Appraisal Update</button>
      <button class="btn block" id="mkcr" title="A new Completion Report for this property, with this report's repairs listed (Appendix A-3)">New Completion Report</button></div>`:''}`;
  // Scoped to this panel: the same markup is drawn in the inspector column on
  // a wide screen and in the work area on a narrow one.
  const $$=sel=>b.querySelector(sel);

  /* The gate asks that every section the report prints has been reviewed, so
     the list of them lives beside the signature rather than one tick at a
     time at the foot of a page. */
  const acked=new Set(S.case.acknowledged||[]);
  const drawn=new Set(S.review.sections_present||[]);
  const box=$$('#acks');
  for(const s of S.sections||[]){
    if(drawn.size&&!drawn.has(s.number)) continue;
    const row=document.createElement('label'); row.className='ackrow';
    row.innerHTML=`<input type="checkbox"${acked.has(s.number)?' checked':''}>
      <span class="n">${String(s.number).padStart(2,'0')}</span>
      <span class="t">${esc(s.tab)}</span>`;
    row.querySelector('.t').onclick=e=>{
      e.preventDefault(); S.section=s.number; drawRail(); goToReport({secn:s.number,section:s.name});};
    row.querySelector('input').onchange=async e=>{
      await api(`/cases/${S.caseId}/acknowledge`,
        {method:'POST',body:JSON.stringify({section:s.number,on:e.target.checked})});
      refresh();};
    box.appendChild(row);
  }

  /* What stands between this case and a ZIP UCDP would take: one XML, one
     PDF, Images, every picture referenced, nothing from a sample. */
  api(`/cases/${S.caseId}/package/check`).then(r=>{
    const box=$$('#pkg'); if(!box||!r||!r.ok) return;
    const d=r.data, faults=(d.faults||[]).filter(f=>f.severity==='Fatal');
    // "ready" is the export's own verdict, sign-off included (B12)
    if(d.ready){ box.innerHTML=`<div class="verdict">Package ready — ${d.images.length} image(s)</div>`; return; }
    const shown=d.signed_off?'':`<li><b>Sign-off</b> The report is not signed yet.</li>`;
    box.innerHTML=`<div class="verdict blocked">${faults.length+(d.schema||[]).length+(d.signed_off?0:1)} problem(s) before export</div>`+
      `<ul class="blockers">${shown}${faults.slice(0,12).map(f=>`<li><b>${esc(f.code)}</b> ${esc(f.message)} ${esc(f.detail||'')}</li>`).join('')}`+
      `${(d.schema||[]).slice(0,5).map(e=>`<li><b>XSD</b> ${esc(e)}</li>`).join('')}</ul>`;
  });

  $$('#back').onclick=showLaunch;
  /* Where the server cannot print (the live site), the PDF is drawn from this
     browser's layout and both downloads come in parts (owner's test B5). */
  hostInfo();
  $$('#openpdf').onclick=e=>{ if(!HOST||HOST.serverLayout) return; e.preventDefault(); openPdf(); };
  $$('#zip').onclick=e=>{ if(!HOST||HOST.serverLayout) return; e.preventDefault(); exportZip(); };
  for(const [id,kind,what] of [['#mkru','update','Restricted Appraisal Update'],['#mkcr','completion','Completion Report']]){
    const bt=$$(id); if(!bt) continue;
    bt.onclick=async()=>{
      if(!await UADDialog.confirm(`A new ${what} is made for this property, carrying the subject, the original appraisal, the borrower and client and${kind==='completion'?" this report's repairs":' lender'}. This report is not changed.`,{title:`New ${what}`,ok:'Create'}))return;
      bt.disabled=true;
      const r=await api(`/cases/${S.caseId}/derive`,{method:'POST',body:JSON.stringify({kind})});
      bt.disabled=false;
      if(!r||!r.ok){ await UADDialog.alert((r&&r.data&&r.data.detail)||'It could not be created.',{title:`New ${what}`}); return; }
      toast(`${what} created — ${r.data.filled.length} field(s) carried over`);
      openCase(r.data.case_id);
    };
  }
  $$('#rev').onclick=async()=>{await api(`/cases/${S.caseId}/state`,
    {method:'POST',body:JSON.stringify({state:'in_review'})}); refresh();};
  $$('#sign').onclick=async()=>{
    const who=await UADDialog.prompt('The name recorded against the signature.',{title:'Sign the report',placeholder:'Your full name',ok:'Sign'}); if(!who)return;
    const r=await fetch(`/api/cases/${S.caseId}/state`,{method:'POST',
      headers:{'Content-Type':'application/json','X-Actor':who},
      body:JSON.stringify({state:'signed'})});
    const d=await r.json();
    if(!r.ok) await UADDialog.alert((d.reasons||[d.error]).join('\n'),{title:'This report cannot be signed yet',eyebrow:'Sign-off'});
    else toast('Signed'); refresh();};
  $$('#zip').onclick=e=>{
    if(!(c.state==='signed'||c.state==='exported')){e.preventDefault();
      UADDialog.alert((rep.blockers||[]).join('\n'),{title:'Sign the report before exporting it',eyebrow:'Delivery package'});}};
}
/* Crossing the breakpoint moves the sign-off panel between the inspector
   column and its own tab, so the chrome is redrawn when it changes. */
window.matchMedia('(max-width:1240px)').addEventListener('change',()=>{
  if(!S.caseId)return;
  if(S.view==='signoff'&&!NARROW()) S.view='form';
  drawHead(); drawWork(); drawInsp();
});

window.saveCell=saveCell;
/* Back to the list of reports.  An unsaved edit is flushed first -- leaving
   the editor is not a reason to lose the value being typed. */
document.getElementById('backhome').onclick=async()=>{
  try{ if(typeof flushPending==='function') await flushPending(); }catch(_){}
  showLaunch();
};
function start(){
  const r=route();
  if(!r) return showLaunch();
  S.section=r.section;
  if(r.section!=null) S.pendingGoto={secn:r.section};   // scrolled to once the report is ready
  openCase(r.caseId);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
else start();
</script>
