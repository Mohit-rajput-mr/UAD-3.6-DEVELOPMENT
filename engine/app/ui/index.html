/* Column resizing, comparable reordering, removal and photos. */
function wireGrid(wrap,g,kind,w){
  const table=wrap.querySelector('table');
  const cols=[...table.querySelectorAll('col')];
  const key=name=>kind+'|'+name;

  table.querySelectorAll('th .grip').forEach(grip=>{
    grip.addEventListener('mousedown',e=>{
      e.preventDefault(); e.stopPropagation();
      const th=grip.closest('th');
      const start=e.clientX;
      const index=[...th.parentNode.children].indexOf(th);
      const colIndex=th.classList.contains('comp')? 2+2*([...table.querySelectorAll('th.comp')].indexOf(th)) : index;
      const col=cols[colIndex];
      const startW=parseFloat(col.style.width)||th.getBoundingClientRect().width;
      const move=ev=>{
        const next=Math.max(46,startW+(ev.clientX-start));
        col.style.width=next+'px';
        S.compWidths[key(th.dataset.col)]=next;
      };
      const up=()=>{document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        saveWidths();};
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    });
  });

  let dragged=null;
  table.querySelectorAll('th.comp').forEach(th=>{
    th.addEventListener('dragstart',e=>{dragged=th;th.classList.add('drag');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',th.dataset.index);});
    th.addEventListener('dragend',()=>{th.classList.remove('drag');
      table.querySelectorAll('th.comp').forEach(x=>x.classList.remove('over'));});
    th.addEventListener('dragover',e=>{e.preventDefault();th.classList.add('over');});
    th.addEventListener('dragleave',()=>th.classList.remove('over'));
    th.addEventListener('drop',async e=>{
      e.preventDefault(); th.classList.remove('over');
      if(!dragged||dragged===th) return;
      const from=Number(dragged.dataset.index), to=Number(th.dataset.index);
      const order=g.comparables.map(c=>c.index);
      order.splice(order.indexOf(from),1);
      order.splice(order.indexOf(to)+(to>from?1:0),0,from);
      const res=await api(`/cases/${S.caseId}/comparables/order`,
        {method:'POST',body:JSON.stringify({kind,order})});
      toast(res.ok?`Comparable ${from} is now #${order.indexOf(from)+1}`:'Could not reorder');
      drawComps(w);
    });
    const remove=th.querySelector('[data-act=remove]');
    if(remove) remove.onclick=async()=>{
      if(!confirm(`Remove comparable #${th.dataset.index}? The ones after it move up.`))return;
      const res=await api(`/cases/${S.caseId}/comparables/${th.dataset.index}?kind=${kind}`,
        {method:'DELETE'});
      toast(res.ok?'Comparable removed':'Could not remove'); drawComps(w);
    };
    const file=th.querySelector('input[type=file]');
    if(file) file.onchange=async()=>{
      if(!file.files.length)return;
      const fd=new FormData(); fd.append('file',file.files[0]);
      const q=`?category=comparable&comparable=${th.dataset.index}&section=22`
             +`&caption=${encodeURIComponent('Comparable #'+th.dataset.index)}`;
      const res=await fetch(`/api/cases/${S.caseId}/media${q}`,{method:'POST',body:fd});
      toast(res.ok?'Photo added':'Could not add the photo'); drawComps(w);
    };
  });
}

/* Prior sale and transfer history belongs to the comparables, but it is
   filled in where it prints -- on the report, like everything else. */
function transferLink(){
  const box=document.createElement('div');
  const s=S.sections.find(x=>x.number===21);
  if(!s) return box;
  box.innerHTML='<div class="bar k" style="margin-top:20px">Prior sale and transfer history</div>'
    +'<p style="font-size:11.5px;color:var(--muted);margin:7px 0 8px">'
    +'The subject’s and each comparable’s history is filled in on the '
    +'report itself, in its own section.</p>';
  const go=document.createElement('button');
  go.className='btn'; go.textContent='Go to Prior Sale and Transfer History';
  go.onclick=()=>{S.section=21;drawRail();goToReport({secn:21,section:s.name});};
  box.appendChild(go);
  return box;
}

/* Every cell is written inside the property that column is about, so a
   comparable's value can never land on the subject. */
async function saveCell(el){
  const column=Number(el.dataset.col||0);
  const kind=S.compKind||'sales';
  const body={value:el.value,kind};
  if(el.dataset.adjust) body.adjust_type=el.dataset.adjust;
  else body.data_point=el.dataset.dp||'';
  const fid=el.dataset.fid||el.dataset.adjust;
  const r=await api(
    `/cases/${S.caseId}/comparables/${column}/fields/${el.dataset.fid||'adjustment'}`,
    {method:'PATCH',body:JSON.stringify(body)});
  if(r&&r.ok){ el.classList.remove('bad'); toast('Saved '+fid); }
  else{ el.classList.add('bad');
    toast((r&&r.data&&r.data.detail)||('Could not save '+fid),7000); }
}

/* ------------------------------------------------------------ review */
/* Errors block the signature, warnings do not, and information is what the
   engine could not decide for itself and a person must read. */
const GROUPS=[
  ['Fatal','Errors','These stop the report being signed.'],
  ['Warning','Warnings','Worth checking; they do not block the signature.'],
  ['Review','Information','Rules that need a person to judge them.'],
];

function drawReview(w){
  const rep=S.review;
  const p=document.createElement('div'); p.className='panel';
  const head=document.createElement('div');
  head.innerHTML=`<div class="counts" style="max-width:520px">
    <div class="count${rep.counts.fatal?' bad':''}"><b>${rep.counts.fatal}</b><span>Errors</span></div>
    <div class="count"><b>${rep.counts.warning}</b><span>Warnings</span></div>
    <div class="count"><b>${rep.counts.review}</b><span>Information</span></div>
    <div class="count"><b>${rep.counts.schema}</b><span>Schema</span></div></div>`;
  const rerun=document.createElement('button');
  rerun.className='btn'; rerun.style.marginTop='10px';
  rerun.textContent='Re-run the review';
  rerun.onclick=async()=>{rerun.disabled=true;rerun.textContent='Re-running…';
    await refresh(); toast('Review re-run'); };
  head.appendChild(rerun);
  p.appendChild(head);

  for(const [sev,title,lede] of GROUPS){
    const items=(rep.items||[]).filter(i=>i.severity===sev);
    if(!items.length) continue;
    const h=document.createElement('div'); h.className='bar k';
    h.textContent=`${title} — ${items.length}`; p.appendChild(h);
    const note=document.createElement('p');
    note.style.cssText='font-size:11.5px;color:var(--muted);margin:6px 0 0';
    note.textContent=lede; p.appendChild(note);
    for(const i of items.slice(0,400)) p.appendChild(findingRow(i));
  }
  if(!(rep.items||[]).length){
    const ok=document.createElement('p'); ok.className='empty';
    ok.textContent='Nothing to report — no finding from the schema, the H-1 rules or completeness.';
    p.appendChild(ok);
  }
  w.innerHTML=''; w.appendChild(p);
}

/* Every finding names the rule that raised it, where it came from, and the
   field it is about -- and offers to take the appraiser straight there. */
function findingRow(i){
  const d=document.createElement('div'); d.className='finding';
  d.style.cursor='default';
  const where=[i.section,i.subsection,i.label].filter(Boolean).join(' · ');
  d.innerHTML=`<div class="top">
      <span class="sev ${esc(i.severity)}">${esc(i.severity==='Review'?'Information':i.severity)}</span>
      <code>${esc(i.code)}</code>
      <span style="font-size:11px;color:var(--muted)">${esc(i.source)}${i.field_id?' · '+esc(i.field_id):''}</span>
    </div>
    <p>${esc(i.message)}</p>
    ${where?`<p style="color:var(--muted)">${esc(where)}</p>`:''}
    ${i.detail?`<p style="color:var(--muted)">${esc(i.detail)}</p>`:''}`;
  if(i.field_id){
    const fix=document.createElement('button');
    fix.className='addbtn'; fix.style.marginTop='5px';
    fix.textContent='Fix this';
    fix.onclick=e=>{e.stopPropagation();jump(i);};
    d.appendChild(fix);
  }
  return d;
}
/* A finding takes the appraiser to the field on the report, not to a form
   about it. */
function jump(item){
  if(item.section_number&&item.section_number!==S.section){
    S.section=item.section_number; drawRail();
  }
  goToReport({fid:item.field_id,secn:item.section_number,
              section:(S.sections.find(s=>s.number===item.section_number)||{}).name});
}
function drawHistory(w){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<div class="bar k">Audit trail</div>';
  w.innerHTML=''; w.appendChild(p);
  api('/cases/'+S.caseId+'/history').then(r=>{
    for(const h of r.data.history){
      const d=document.createElement('div'); d.className='finding'; d.style.cursor='default';
      d.innerHTML=`<div class="top"><code>${esc(h.at.replace('T',' ').replace('+00:00',''))}</code>
        <b style="font-size:11.5px">${esc(h.action)}</b>
        <span style="font-size:11px;color:var(--muted)">${esc(h.actor)}</span></div>
        ${h.detail?`<p>${esc(h.detail)}</p>`:''}`;
      p.appendChild(d);}});
}

/* --------------------------------------------------------- inspector */
/* Below the breakpoint the inspector column is dropped, so the same panel is
   reachable as a tab instead -- hiding the only route to Sign off and Export
   is not a responsive layout, it is a missing feature. */
const NARROW=()=>window.matchMedia('(max-width:1240px)').matches;

function drawInsp(){
  const b=$('#insp');
  if(b&&!NARROW()) fillSignoff(b);
}

function fillSignoff(b){
  if(!b)return;
  const rep=S.review,c=S.case;
  const ready=rep.ready&&!(rep.blockers||[]).length;
  b.innerHTML=`<div class="panelhead k">Sign-off</div>
    <div class="panelblock"><div class="counts">
      <div class="count${rep.counts.fatal?' bad':''}"><b>${rep.counts.fatal}</b><span>Fatal</span></div>
      <div class="count"><b>${rep.counts.warning}</b><span>Warn</span></div>
      <div class="count"><b>${rep.counts.review}</b><span>Read</span></div>
      <div class="count"><b>${rep.counts.schema}</b><span>XSD</span></div></div></div>
    <div class="panelblock">
      <div class="verdict ${ready?'':'blocked'}">${ready?'Ready to sign':'Not ready to sign'}</div>
      ${(rep.blockers||[]).length?`<ul class="blockers">${rep.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    </div>
    <div class="panelhead k">Delivery package (B-1)</div>
    <div class="panelblock" id="pkg"><span class="empty" style="padding:0">Checking…</span></div>
    <div class="panelhead k">Sections reviewed</div>
    <div class="panelblock acks" id="acks"></div>
    <div class="panelblock actions">
      <button class="btn block" id="rev">Move to review</button>
      <button class="btn block primary" id="sign" ${ready&&c.can.includes('signed')?'':'disabled'}>Sign off</button>
      <a class="btn block" id="zip" href="/api/cases/${S.caseId}/package.zip">Export ZIP</a>
      <a class="btn block" href="/api/cases/${S.caseId}/report.pdf" target="_blank">Open PDF</a>
      <a class="btn block" href="/api/cases/${S.caseId}/mismo.xml" target="_blank">Open MISMO XML</a>
      <a class="btn block" href="/api/cases/${S.caseId}/portable.xml" download
         title="The whole appraisal in one UAD 3.6 XML, pictures inside: import it anywhere this software runs">Download portable XML</a>
      <button class="btn block" id="back">All cases</button></div>`;
  // Scoped to this panel: the same markup is drawn in the inspector column on
  // a wide screen and in the work area on a narrow one.
  const $$=sel=>b.querySelector(sel);

  /* The gate asks that every section the report prints has been reviewed, so
     the list of them lives beside the signature rather than one tick at a
     time at the foot of a page. */
  const acked=new Set(S.case.acknowledged||[]);
  const drawn=new Set(S.review.sections_present||[]);
  const box=$$('#acks');
  for(const s of S.sections||[]){
    if(drawn.size&&!drawn.has(s.number)) continue;
    const row=document.createElement('label'); row.className='ackrow';
    row.innerHTML=`<input type="checkbox"${acked.has(s.number)?' checked':''}>
      <span class="n">${String(s.number).padStart(2,'0')}</span>
      <span class="t">${esc(s.tab)}</span>`;
    row.querySelector('.t').onclick=e=>{
      e.preventDefault(); S.section=s.number; drawRail(); goToReport({secn:s.number,section:s.name});};
    row.querySelector('input').onchange=async e=>{
      await api(`/cases/${S.caseId}/acknowledge`,
        {method:'POST',body:JSON.stringify({section:s.number,on:e.target.checked})});
      refresh();};
    box.appendChild(row);
  }

  /* What stands between this case and a ZIP UCDP would take: one XML, one
     PDF, Images, every picture referenced, nothing from a sample. */
  api(`/cases/${S.caseId}/package/check`).then(r=>{
    const box=$$('#pkg'); if(!box||!r||!r.ok) return;
    const d=r.data, faults=(d.faults||[]).filter(f=>f.severity==='Fatal');
    if(d.ready){ box.innerHTML=`<div class="verdict">Package ready — ${d.images.length} image(s)</div>`; return; }
    box.innerHTML=`<div class="verdict blocked">${faults.length+(d.schema||[]).length} problem(s)</div>`+
      `<ul class="blockers">${faults.slice(0,12).map(f=>`<li><b>${esc(f.code)}</b> ${esc(f.message)} ${esc(f.detail||'')}</li>`).join('')}`+
      `${(d.schema||[]).slice(0,5).map(e=>`<li><b>XSD</b> ${esc(e)}</li>`).join('')}</ul>`;
  });

  $$('#back').onclick=showLaunch;
  $$('#rev').onclick=async()=>{await api(`/cases/${S.caseId}/state`,
    {method:'POST',body:JSON.stringify({state:'in_review'})}); refresh();};
  $$('#sign').onclick=async()=>{
    const who=prompt('Sign as (your name):'); if(!who)return;
    const r=await fetch(`/api/cases/${S.caseId}/state`,{method:'POST',
      headers:{'Content-Type':'application/json','X-Actor':who},
      body:JSON.stringify({state:'signed'})});
    const d=await r.json();
    if(!r.ok) alert('Cannot sign yet:\n\n'+(d.reasons||[d.error]).join('\n'));
    else toast('Signed'); refresh();};
  $$('#zip').onclick=e=>{
    if(!(c.state==='signed'||c.state==='exported')){e.preventDefault();
      alert('The package can only be exported once the case is signed.\n\n'+
        (rep.blockers||[]).join('\n'));}};
}
/* Crossing the breakpoint moves the sign-off panel between the inspector
   column and its own tab, so the chrome is redrawn when it changes. */
window.matchMedia('(max-width:1240px)').addEventListener('change',()=>{
  if(!S.caseId)return;
  if(S.view==='signoff'&&!NARROW()) S.view='form';
  drawHead(); drawWork(); drawInsp();
});

window.saveCell=saveCell;
/* Back to the list of reports.  An unsaved edit is flushed first -- leaving
   the editor is not a reason to lose the value being typed. */
document.getElementById('backhome').onclick=async()=>{
  try{ if(typeof flushPending==='function') await flushPending(); }catch(_){}
  showLaunch();
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',showLaunch);
else showLaunch();
</script>
